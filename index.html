<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Queue Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🎫 Smart Queue Management System</h1>

<div class="container">

  <div class="card">
    <h2>Get a Token</h2>
    <input type="text" id="custName" placeholder="Enter your name">
    <select id="service">
      <option value="General">General Service</option>
      <option value="Billing">Billing</option>
      <option value="Support">Technical Support</option>
    </select>
    <button onclick="generateToken()">Generate Token</button>
    <p id="tokenResult"></p>
  </div>

  <div class="card now-serving">
    <h2>Now Serving</h2>
    <div class="token" id="nowServing">--</div>
    <p id="nowServingName">Waiting for staff to start...</p>
  </div>

  <div class="card">
    <h2>Staff Panel</h2>
    <button onclick="callNext()">Call Next Customer</button>
    <button class="danger" onclick="resetQueue()">Reset Queue</button>
    <h3>Queue</h3>
    <ul id="queueList"></ul>
    <p class="waiting-count" id="waitingCount">0 people waiting</p>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
